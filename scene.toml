# Default scene template for ai-rt.
# Camera and light angles are in degrees. Camera faces -Z at zero rotation.
# The light direction points from a surface toward the light and faces +Z at
# zero rotation.

[camera]
position = [0.0, 0.0, 0.0]
yaw = 0.0
pitch = 0.0
roll = 0.0

[light]
yaw = -25.0
pitch = -35.0
roll = 0.0

# Unit-sphere mesh density. Higher values produce more triangles and a smoother
# silhouette. The same generated mesh is instanced by every object below.
[geometry]
latitude_segments = 32
longitude_segments = 64

[materials.textured]
albedo = { texture = "textures/default_albedo.png" }
# Repeat the small map across the sphere instead of stretching it once.
uv_scale = [8.0, 8.0]
roughness = { texture = "textures/default_roughness.png" }
metalness = { texture = "textures/default_metalness.png" }
latent = { texture = "models/pbr_mlp_v1/latents/material_0.latent" }

[materials.constant]
albedo = [0.0, 0.7, 1.0]
roughness = 0.5
metalness = 0.0
latent = { texture = "models/pbr_mlp_v1/latents/material_1.latent" }

[materials.gold]
albedo = [0.95, 0.75, 0.1]
roughness = 0.28
metalness = 1.0
latent = { texture = "models/pbr_mlp_v1/latents/material_2.latent" }

[[objects]]
position = [0.0, 0.0, -3.0]
radius = 1.0
material = "textured"

[[objects]]
position = [-1.5, -0.25, -4.0]
radius = 0.65
material = "constant"

[[objects]]
position = [1.35, 0.35, -4.5]
radius = 0.85
material = "gold"
