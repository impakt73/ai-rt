[package]
name = "ai-rt"
version = "0.1.0"
edition = "2024"
default-run = "ai-rt"

[features]
default = []
train = ["burn/train", "dep:rand", "dep:rand_chacha"]

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "flex"] }
bvh = "0.12"
clap = { version = "4", features = ["derive"] }
image = "0.25"
nalgebra = "0.34"
png = "0.17"
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
image-compare = "0.5"

[[bin]]
name = "train_shader"
path = "src/bin/train_shader.rs"
required-features = ["train"]
